<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catalog Integration Test</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 2rem;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
        color: #f8fafc;
      }
      .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 2rem;
        font-size: 0.875rem;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .status-card {
        background: #1e293b;
        border-radius: 8px;
        padding: 1.25rem;
        border: 1px solid #334155;
      }
      .status-card h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-bottom: 0.5rem;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-badge.connected {
        background: #064e3b;
        color: #6ee7b7;
      }
      .status-badge.disconnected {
        background: #7f1d1d;
        color: #fca5a5;
      }
      .section {
        background: #1e293b;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1rem;
        border: 1px solid #334155;
      }
      .section h2 {
        font-size: 1rem;
        margin-bottom: 1rem;
        color: #f1f5f9;
      }
      .btn {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 500;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        transition: opacity 0.15s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: #2563eb;
        color: white;
      }
      .btn-danger {
        background: #dc2626;
        color: white;
      }
      .btn-success {
        background: #059669;
        color: white;
      }
      input {
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        color: #e2e8f0;
        font-size: 0.8rem;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        width: 150px;
      }
      input::placeholder {
        color: #64748b;
      }
      pre {
        background: #0f172a;
        border-radius: 6px;
        padding: 1rem;
        overflow-x: auto;
        font-size: 0.75rem;
        margin-top: 0.75rem;
        border: 1px solid #334155;
        max-height: 300px;
        overflow-y: auto;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
